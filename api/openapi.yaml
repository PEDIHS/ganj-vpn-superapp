openapi: 3.1.0
info:
  title: Ganj VPN Control API
  version: 0.2.0
  summary: Versioned contract for Ganj VPN mobile, Telegram, and admin clients.
  license:
    name: Proprietary
    url: https://github.com/PEDIHS/ganj-vpn-superapp/blob/main/LICENSE
  description: >-
    Phase 0 Enterprise contract. Connection profiles are issued exclusively from
    an active user entitlement as device-bound encrypted envelopes. Manual URI,
    clipboard, QR, file, or arbitrary VPN configuration import is intentionally
    unsupported. Raw VPN credentials are never accepted or returned by this API.
  contact:
    name: Ganj VPN Engineering
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder; production host is configured outside source control.
security:
  - bearerAuth: []
tags:
  - name: Bootstrap
    description: Public application configuration and compatibility policy.
  - name: Auth
    description: Guest and Telegram authentication session lifecycle.
  - name: Account
    description: Current user profile and trusted devices.
  - name: Services
    description: Purchased VPN services and device-bound connection profiles.
  - name: Servers
    description: Entitlement-filtered server catalog and Smart Connect ranking.
  - name: Connections
    description: Privacy-minimized VPN connection session accounting.
  - name: Store
    description: Plans, orders, and channel-specific purchase verification.
  - name: Wallet
    description: Wallet balance and immutable ledger views.
  - name: Notifications
    description: User inbox and push delivery registration.
  - name: Experience
    description: Consent-aware analytics, remote configuration, feature assignment, and feedback.
  - name: Reliability
    description: Privacy-minimized crash, bug, attachment, and diagnostic reporting.
  - name: Support
    description: Tickets, conversations, FAQ, and knowledge-base discovery.
  - name: Privacy
    description: Consent, export, deletion, and processing transparency controls.
  - name: AdminIssues
    description: Scoped issue triage and controlled bug lifecycle transitions.
  - name: AdminOperations
    description: Monitoring, alerts, releases, backups, disaster recovery, and quality gates.
  - name: AdminSecurity
    description: SOC investigation and anti-abuse decisions with immutable audit evidence.
  - name: AdminProduct
    description: Aggregated product metrics, funnels, localization, and product intelligence.
paths:
  /app/bootstrap:
    get:
      summary: Get public app bootstrap
      tags: [Bootstrap]
      operationId: getBootstrap
      security: []
      responses:
        '200':
          description: Public app bootstrap and signed compatibility policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  # BEGIN AUTH_SESSION_V1_PATHS
  /auth/guest:
    post:
      summary: Create a device-bound guest session
      description: >-
        Registers the installation P-256 signing identity and X25519 encryption identity only
        after a valid GDP1 proof over the canonical unsigned request body. No manual VPN
        configuration or raw credential is accepted.
      tags: [Auth]
      operationId: createGuestSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [device_id, key_version, signing_public_key_spki, encryption_public_key_raw, device_proof]
              properties:
                device_id: { type: string, format: uuid }
                key_version: { type: string, pattern: '^v[1-9][0-9]{0,8}$' }
                signing_public_key_spki: { type: string, minLength: 80, maxLength: 512 }
                encryption_public_key_raw:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: '^[A-Za-z0-9_-]{43}$'
                device_proof: { $ref: '#/components/schemas/Gdp1DeviceProof' }
      responses:
        '201':
          description: Guest user/device session with rotating credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/telegram/start:
    post:
      summary: Start Telegram OIDC authorization for the authenticated device
      description: >-
        Creates a short-lived, one-time state bound to the currently authenticated Ganj user and
        device. Only S256 PKCE and server-allowlisted redirect URIs are accepted.
      tags: [Auth]
      operationId: startTelegramOidc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code_challenge, redirect_uri]
              properties:
                code_challenge:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: '^[A-Za-z0-9_-]{43}$'
                redirect_uri:
                  type: string
                  format: uri
                  maxLength: 2048
      responses:
        '200':
          description: OIDC authorization URL and one-time anti-CSRF state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramStartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/telegram/exchange:
    post:
      summary: Exchange a one-time Telegram authorization code
      description: >-
        Consumes the stored state under a database lock, validates S256 PKCE, verifies the Telegram
        ID token and atomically links the authenticated device to the resolved Ganj account.
      tags: [Auth]
      operationId: exchangeTelegramCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, state, code_verifier]
              properties:
                code: { type: string, minLength: 8, maxLength: 2048 }
                state: { type: string, minLength: 32, maxLength: 512 }
                code_verifier: { type: string, minLength: 43, maxLength: 128 }
      responses:
        '200':
          description: Telegram-linked device-bound session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      summary: Rotate the device-bound access and refresh session
      description: >-
        Consumes the current opaque refresh token once, validates a fresh GDP1 proof from the same
        device and rotates both credentials. Refresh-token reuse revokes the entire session family.
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token, device_id, device_proof]
              properties:
                refresh_token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  pattern: '^[A-Za-z0-9_-]{43}$'
                device_id: { type: string, format: uuid }
                device_proof: { $ref: '#/components/schemas/Gdp1DeviceProof' }
      responses:
        '200':
          description: Rotated access and refresh credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/logout:
    post:
      summary: Revoke the current session family
      tags: [Auth]
      operationId: logoutSession
      responses:
        '200':
          description: Current access session and its refresh-token family were revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      summary: Get the current user
      tags: [Account]
      operationId: getCurrentUser
      responses:
        '200':
          description: Current account summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/devices:
    get:
      summary: List trusted devices
      tags: [Account]
      operationId: listDevices
      responses:
        '200':
          description: User devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/devices/{device_id}:
    delete:
      summary: Revoke a trusted device
      tags: [Account]
      operationId: revokeDevice
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': { description: Device and sessions revoked. }
        '404': { $ref: '#/components/responses/NotFound' }
  /services:
    get:
      summary: List owned VPN services
      tags: [Services]
      operationId: listServices
      responses:
        '200':
          description: Services owned by the current user; no raw configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /services/{service_id}:
    get:
      summary: Get a VPN service
      tags: [Services]
      operationId: getService
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service details and entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /services/{service_id}/connection-profile:
    post:
      summary: Issue a device-bound connection profile
      tags: [Services]
      operationId: createConnectionProfile
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, server_id, client_nonce, device_proof]
              properties:
                device_id: { type: string, format: uuid }
                server_id: { type: string, format: uuid }
                client_nonce: { type: string, minLength: 32 }
                device_proof: { type: string, minLength: 32 }
      responses:
        '201':
          description: Short-lived, device-bound encrypted connection profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionProfileResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
  /servers:
    get:
      summary: List available VPN servers
      tags: [Servers]
      operationId: listServers
      parameters:
        - name: tier
          in: query
          schema: { type: string, enum: [free, premium, vip] }
        - name: country
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - name: protocol
          in: query
          schema: { $ref: '#/components/schemas/Protocol' }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Entitlement-filtered server catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /servers/recommend:
    post:
      summary: Rank Smart Connect server candidates
      tags: [Servers]
      operationId: recommendServers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, network_type]
              properties:
                service_id: { type: string, format: uuid }
                network_type: { type: string, enum: [wifi, cellular, ethernet, unknown] }
                recent_results:
                  type: array
                  maxItems: 20
                  items:
                    $ref: '#/components/schemas/ProbeResult'
      responses:
        '200':
          description: Ordered candidates and scoring hints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerRecommendationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /connections/start:
    post:
      summary: Start a connection accounting session
      tags: [Connections]
      operationId: startConnectionSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, server_id, protocol, started_at]
              properties:
                service_id: { type: string, format: uuid }
                server_id: { type: string, format: uuid }
                protocol: { $ref: '#/components/schemas/Protocol' }
                started_at: { type: string, format: date-time }
                app_version: { type: string }
      responses:
        '201':
          description: Privacy-minimized connection session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionSessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /connections/{connection_id}/end:
    post:
      summary: Finalize a connection accounting session
      tags: [Connections]
      operationId: endConnectionSession
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ended_at, bytes_up, bytes_down]
              properties:
                ended_at: { type: string, format: date-time }
                bytes_up: { type: integer, minimum: 0 }
                bytes_down: { type: integer, minimum: 0 }
                error_code: { type: [string, 'null'], maxLength: 64 }
      responses:
        '204': { description: Session finalized. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /store/plans:
    get:
      summary: List purchasable subscription plans
      tags: [Store]
      operationId: listPlans
      security: []
      parameters:
        - name: channel
          in: query
          required: true
          schema: { type: string, enum: [play, direct] }
      responses:
        '200':
          description: Channel-compliant plans and prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders:
    post:
      summary: Create an idempotent order
      tags: [Store]
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id, channel]
              properties:
                plan_id: { type: string, format: uuid }
                channel: { type: string, enum: [play, direct, wallet] }
                service_id: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Pending or completed order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409': { $ref: '#/components/responses/Conflict' }
  /orders/{order_id}:
    get:
      summary: Get an owned order and its verification status
      tags: [Store]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Ownership-scoped order state for checkout recovery and reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /billing/play/verify:
    post:
      summary: Verify a Google Play purchase
      tags: [Store]
      operationId: verifyPlayPurchase
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, product_id, purchase_token]
              properties:
                order_id: { type: string, format: uuid }
                product_id: { type: string }
                purchase_token: { type: string, minLength: 16 }
      responses:
        '200':
          description: Server-verified purchase and entitlement state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /billing/play/rtdn:
    post:
      summary: Receive an authenticated Google Play real-time developer notification
      description: >-
        Internal Google Pub/Sub push endpoint. A notification is only a reconciliation
        signal; the authoritative subscription state is fetched again from Android
        Publisher subscriptions v2 before any entitlement change.
      tags: [Store]
      operationId: receiveGooglePlayRtdn
      security:
        - googlePubSubOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePubSubPush'
      responses:
        '200':
          description: Notification accepted or safely deduplicated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Publisher reconciliation is temporarily unavailable; Pub/Sub may retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /wallet:
    get:
      summary: Get wallet balance
      tags: [Wallet]
      operationId: getWallet
      responses:
        '200':
          description: Derived wallet balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /wallet/transactions:
    get:
      summary: List wallet transactions
      tags: [Wallet]
      operationId: listWalletTransactions
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Cursor-paginated wallet ledger view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications:
    get:
      summary: List user notifications
      tags: [Notifications]
      operationId: listNotifications
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: User notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices/{device_id}/push-token:
    put:
      summary: Register a device push token
      tags: [Notifications]
      operationId: upsertPushToken
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { type: string, enum: [fcm, apns] }
                token: { type: string, minLength: 16 }
      responses:
        '204': { description: Push token encrypted and registered. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /app/runtime-config:
    get:
      summary: Resolve signed remote configuration and feature assignments
      description: >-
        Returns only values applicable to the authenticated device, locale,
        subscription, and rollout cohort. Secrets and raw VPN configuration are excluded.
      tags: [Experience]
      operationId: getRuntimeConfiguration
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
        - name: X-App-Version
          in: header
          required: true
          schema: { type: string, pattern: '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$' }
        - name: X-Platform
          in: header
          required: true
          schema: { type: string, enum: [android] }
        - name: Accept-Language
          in: header
          schema: { type: string, default: fa-IR }
      responses:
        '200':
          description: Signed, versioned runtime values and deterministic feature assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeConfigurationResponse' }
        '304': { description: Cached configuration remains current. }
  /app/localizations/{locale}:
    get:
      summary: Get a signed localization delta
      tags: [Experience]
      operationId: getLocalizationBundle
      security: []
      parameters:
        - name: locale
          in: path
          required: true
          schema: { type: string, enum: [fa-IR, en-US, ar, tr-TR, de-DE] }
        - name: version
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Public copy-only localization bundle; security-critical copy remains app-bundled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalizationBundleResponse' }
  /app/update-policy:
    get:
      summary: Resolve update requirement for this installation
      tags: [Experience]
      operationId: getUpdatePolicy
      responses:
        '200':
          description: Signed force/optional/beta policy resolved for the device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatePolicyResponse' }
  /telemetry/events:batch:
    post:
      summary: Submit a consent-aware analytics batch
      description: >-
        Analytics is accepted only for a currently granted purpose and contains no
        VPN destinations, DNS queries, payload content, raw IP address, or advertising ID.
      tags: [Experience]
      operationId: ingestAnalyticsEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsBatchRequest' }
      responses:
        '202':
          description: Valid consented events persisted idempotently; disallowed fields are rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsBatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /telemetry/crashes:
    post:
      summary: Submit a privacy-scrubbed crash event
      tags: [Reliability]
      operationId: ingestCrashEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrashEventRequest' }
      responses:
        '202': { description: Crash fingerprinted and queued after server-side redaction. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /reliability/bug-reports:
    get:
      summary: List bug reports created by the current user
      tags: [Reliability]
      operationId: listMyBugReports
      responses:
        '200':
          description: User-safe status summaries without internal investigation details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReportListResponse' }
    post:
      summary: Create a structured bug report
      tags: [Reliability]
      operationId: createBugReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BugReportRequest' }
      responses:
        '201':
          description: Report created with sanitized diagnostic context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BugReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /reliability/bug-reports/{bug_id}/attachments:
    post:
      summary: Register an encrypted bug-report attachment upload
      description: >-
        Returns a short-lived upload grant after MIME, size, ownership, malware-scan,
        and retention policy checks. Screen recordings require explicit consent.
      tags: [Reliability]
      operationId: createBugAttachmentUpload
      parameters:
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentUploadRequest' }
      responses:
        '201':
          description: Short-lived object-storage upload grant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUploadResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /diagnostics/reports:
    post:
      summary: Submit an explicitly approved diagnostic report
      description: >-
        Accepts allowlisted DNS result classes, latency, packet loss, network type,
        VPN state, and coarse device data. Hostnames, destinations, credentials, and content are prohibited.
      tags: [Reliability]
      operationId: createDiagnosticReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiagnosticReportRequest' }
      responses:
        '201':
          description: Redacted diagnostic report with a bounded retention period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticReportResponse' }
  /support/tickets:
    get:
      summary: List the current user's support tickets
      tags: [Support]
      operationId: listSupportTickets
      responses:
        '200':
          description: Support ticket list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketListResponse' }
    post:
      summary: Open a support ticket
      tags: [Support]
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketRequest' }
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketResponse' }
  /support/tickets/{ticket_id}/messages:
    post:
      summary: Add a message to an owned support ticket
      tags: [Support]
      operationId: createSupportMessage
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id, body]
              properties:
                client_message_id: { type: string, format: uuid }
                body: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        '201': { description: Message appended idempotently. }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/knowledge-base:
    get:
      summary: Search localized published help content
      tags: [Support]
      operationId: searchKnowledgeBase
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 128 }
        - name: locale
          in: query
          schema: { type: string, default: fa-IR }
      responses:
        '200':
          description: Published FAQ and knowledge-base results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeBaseResponse' }
  /feedback:
    post:
      summary: Send categorized product feedback or a feature request
      tags: [Experience]
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackRequest' }
      responses:
        '201': { description: Feedback accepted without exposing identity to product analytics by default. }
  /me/consents:
    get:
      summary: Get current consent state by purpose
      tags: [Privacy]
      operationId: listMyConsents
      responses:
        '200':
          description: Current consent receipts and policy versions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentListResponse' }
    put:
      summary: Grant or withdraw consent
      tags: [Privacy]
      operationId: updateConsent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentUpdateRequest' }
      responses:
        '204': { description: Consent receipt appended; withdrawal takes effect for future processing. }
  /me/accessibility:
    get:
      summary: Get accessibility preferences
      tags: [Privacy]
      operationId: getAccessibilityPreferences
      responses:
        '200':
          description: Account-level accessibility preferences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessibilityPreferencesResponse' }
    put:
      summary: Update accessibility preferences
      tags: [Privacy]
      operationId: updateAccessibilityPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessibilityPreferences' }
      responses:
        '204': { description: Preferences updated. }
  /me/privacy/export:
    post:
      summary: Request a portable personal-data export
      tags: [Privacy]
      operationId: requestPrivacyExport
      responses:
        '202':
          description: Identity-verified export job created; download is short-lived and encrypted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestResponse' }
  /me/privacy/deletion-request:
    post:
      summary: Request account and personal-data deletion
      tags: [Privacy]
      operationId: requestAccountDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation, device_proof]
              properties:
                confirmation: { type: string, const: DELETE_MY_ACCOUNT }
                device_proof: { type: string, minLength: 32 }
      responses:
        '202':
          description: Deletion workflow created subject to fraud, billing, and legal holds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyRequestResponse' }
  /admin/issues:
    get:
      summary: Search and prioritize reliability issues
      description: Requires `admin:issues:read`, MFA, tenant policy, and audited access.
      tags: [AdminIssues]
      operationId: adminListIssues
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [critical, high, medium, low] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BugStatus' }
      responses:
        '200':
          description: Prioritized bug groups and user-impact estimates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminIssueListResponse' }
  /admin/issues/{bug_id}/transition:
    post:
      summary: Apply a controlled issue lifecycle transition
      description: Requires `admin:issues:write`; impossible transitions return 409 and every attempt is audited.
      tags: [AdminIssues]
      operationId: adminTransitionIssue
      parameters:
        - $ref: '#/components/parameters/BugId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BugTransitionRequest' }
      responses:
        '204': { description: Transition and assignment history appended. }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/crashes/groups:
    get:
      summary: List deduplicated crash groups
      tags: [AdminIssues]
      operationId: adminListCrashGroups
      responses:
        '200':
          description: Crash fingerprints, affected version/user counts, and priority.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrashGroupListResponse' }
  /admin/remote-config/releases:
    post:
      summary: Stage an immutable remote-configuration release
      description: Requires dual control for security, billing, privacy, or VPN policy keys.
      tags: [AdminProduct]
      operationId: adminCreateRemoteConfigRelease
      x-required-scopes: [admin:config:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteConfigReleaseRequest' }
      responses:
        '201':
          description: Draft release created; publication is separately authorized and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteConfigReleaseResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/remote-config/releases/{release_id}/publish:
    post:
      summary: Publish a reviewed immutable remote-configuration release
      description: Production publication requires a different authenticated administrator from the creator.
      tags: [AdminProduct]
      operationId: adminPublishRemoteConfigRelease
      x-required-scopes: [admin:config:publish]
      parameters:
        - name: release_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 8, maxLength: 500 }
      responses:
        '200':
          description: Release published and previous release retired atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoteConfigReleaseResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/feature-flags/{flag_key}:
    put:
      summary: Version a feature flag rollout policy
      tags: [AdminProduct]
      operationId: adminUpdateFeatureFlag
      x-required-scopes: [admin:flags:write]
      parameters:
        - name: flag_key
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,127}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlagPolicyRequest' }
      responses:
        '200':
          description: New immutable flag version stored; assignment remains deterministic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlagVersionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-log:
    get:
      summary: List append-only administrative control-plane audit events
      tags: [AdminProduct]
      operationId: adminListAuditEvents
      x-required-scopes: [admin:audit:read]
      responses:
        '200':
          description: Sanitized audit metadata; content and secret values are never returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/monitoring/overview:
    get:
      summary: Get privacy-safe operational health aggregates
      tags: [AdminOperations]
      operationId: adminGetMonitoringOverview
      responses:
        '200':
          description: Server/backend CPU, memory, bandwidth, latency, packet loss, queue, DB, and error-rate aggregates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoringOverviewResponse' }
  /admin/alerts:
    get:
      summary: List active alert incidents
      tags: [AdminOperations]
      operationId: adminListAlerts
      responses:
        '200':
          description: Deduplicated and routed infrastructure, backend, security, and product alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertListResponse' }
  /admin/alerts/{alert_id}/acknowledge:
    post:
      summary: Acknowledge an alert incident
      tags: [AdminOperations]
      operationId: adminAcknowledgeAlert
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '204': { description: Alert acknowledged with actor and timestamp in the audit log. }
  /admin/releases:
    post:
      summary: Create an application or backend release candidate
      tags: [AdminOperations]
      operationId: adminCreateRelease
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseRequest' }
      responses:
        '201': { description: Release candidate created in development or testing. }
  /admin/releases/{release_id}/promote:
    post:
      summary: Promote a release through an allowed environment gate
      description: Production promotion requires signed artifacts, passing quality/security gates, approval, and rollback metadata.
      tags: [AdminOperations]
      operationId: adminPromoteRelease
      parameters:
        - name: release_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_environment]
              properties:
                target_environment: { type: string, enum: [testing, staging, production] }
                rollout_percent: { type: integer, minimum: 1, maximum: 100, default: 5 }
      responses:
        '202': { description: Gated deployment queued. }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/quality/runs:
    post:
      summary: Record a CI test, scan, or quality run
      tags: [AdminOperations]
      operationId: adminCreateQualityRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityRunRequest' }
      responses:
        '201': { description: Immutable run and findings registered using artifact digests. }
  /admin/backups:
    post:
      summary: Start a policy-controlled backup
      tags: [AdminOperations]
      operationId: adminCreateBackup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupRequest' }
      responses:
        '202': { description: Encrypted backup job queued in a separate failure domain. }
  /admin/disaster-recovery/exercises:
    post:
      summary: Schedule or record a disaster-recovery exercise
      tags: [AdminOperations]
      operationId: adminCreateDisasterRecoveryExercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisasterRecoveryExerciseRequest' }
      responses:
        '201': { description: Exercise created with RPO/RTO objectives and isolated restore target. }
  /admin/security/cases:
    get:
      summary: List SOC cases visible to the current analyst
      tags: [AdminSecurity]
      operationId: adminListSecurityCases
      responses:
        '200':
          description: Least-privilege security cases with pseudonymous subjects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityCaseListResponse' }
  /admin/security/abuse-actions:
    post:
      summary: Apply a proportionate anti-abuse action
      description: Automated signals alone cannot permanently block or delete a user; high-impact action requires review and appeal metadata.
      tags: [AdminSecurity]
      operationId: adminCreateAbuseAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbuseActionRequest' }
      responses:
        '202': { description: Action queued or held for required human approval. }
  /admin/product/metrics:
    get:
      summary: Get k-anonymous product and commercial aggregates
      tags: [AdminProduct]
      operationId: adminGetProductMetrics
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Growth, retention, revenue, conversion, churn, and active-user aggregates with small-cell suppression.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMetricsResponse' }
  /admin/product/funnels/{funnel_key}:
    get:
      summary: Get a consent-aware funnel aggregate
      tags: [AdminProduct]
      operationId: adminGetFunnel
      parameters:
        - name: funnel_key
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Aggregated step conversion and drop-off with no event-level export.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FunnelResponse' }
  /admin/product-intelligence/recommendations:
    get:
      summary: List explainable product intelligence recommendations
      description: Recommendations are advisory, versioned, drift-monitored, and require a human decision for user-affecting changes.
      tags: [AdminProduct]
      operationId: adminListProductIntelligenceRecommendations
      responses:
        '200':
          description: Churn, quality, server, and campaign recommendations with confidence and evidence windows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductRecommendationListResponse' }
  /admin/documentation/artifacts:
    get:
      summary: List versioned operational and developer documentation artifacts
      tags: [AdminOperations]
      operationId: adminListDocumentationArtifacts
      responses:
        '200':
          description: Architecture, API, database, deployment, security, and developer guide versions and owners.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentationArtifactListResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    googlePubSubOidc:
      type: openIdConnect
      openIdConnectUrl: https://accounts.google.com/.well-known/openid-configuration
      description: >-
        Google-signed Pub/Sub push identity restricted to the configured service account,
        issuer, audience and endpoint. It is not an end-user bearer session.
  parameters:
    DeviceId:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BugId:
      name: bug_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertId:
      name: alert_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
  responses:
    BadRequest:
      description: Invalid request.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Missing, invalid, expired, or reused session.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Entitlement or policy rejected the operation.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource was not found or is not owned by the current user.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Idempotency or state conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    Meta:
      type: object
      required: [request_id, server_time]
      properties:
        request_id: { type: string, format: uuid }
        server_time: { type: string, format: date-time }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean, default: false }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
    ErrorResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: 'null' }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { $ref: '#/components/schemas/Error' }
    # BEGIN AUTH_SESSION_V1_SCHEMAS
    Gdp1DeviceProof:
      type: string
      minLength: 80
      maxLength: 1024
      pattern: '^gdp1\.[0-9]+\.[A-Za-z0-9_-]{22,128}\.[A-Za-z0-9_-]{43}\.v[1-9][0-9]{0,8}\.[A-Za-z0-9_-]{80,128}$'
      description: >-
        Replay-resistant P-256/ES256 device proof bound to HTTP method, full /v1 path and query,
        canonical unsigned body SHA-256, timestamp, nonce and registered device key version.
    AuthSessionData:
      type: object
      additionalProperties: false
      required:
        [user_id, device_id, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at, token_type]
      properties:
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        access_token:
          type: string
          minLength: 32
          maxLength: 8192
          description: Short-lived EdDSA bearer JWT; never log or persist outside the secure session vault.
        access_token_expires_at: { type: string, format: date-time }
        refresh_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Opaque rotating credential; server storage is SHA-256 digest only.
        refresh_token_expires_at: { type: string, format: date-time }
        token_type: { type: string, enum: [Bearer] }
    AuthSessionResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/AuthSessionData' }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    LogoutResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [logged_out]
          properties:
            logged_out: { type: boolean, const: true }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    # END AUTH_SESSION_V1_SCHEMAS
    DeviceRegistration:
      type: object
      required: [platform, public_key, app_version, os_version]
      properties:
        platform: { type: string, enum: [android, ios] }
        public_key: { type: string, contentEncoding: base64 }
        key_attestation: { type: [object, 'null'], additionalProperties: true }
        app_version: { type: string }
        os_version: { type: string }
        locale: { type: string, default: fa-IR }
    AuthTokens:
      type: object
      required: [access_token, access_expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token: { type: string }
        access_expires_in: { type: integer, example: 600 }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer, example: 2592000 }
    AuthResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          required: [user, device_id, tokens]
          properties:
            user: { $ref: '#/components/schemas/User' }
            device_id: { type: string, format: uuid }
            tokens: { $ref: '#/components/schemas/AuthTokens' }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    TelegramStartResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          required: [authorization_url, state, expires_at]
          properties:
            authorization_url: { type: string, format: uri }
            state: { type: string }
            expires_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    User:
      type: object
      required: [id, status, display_name, locale, telegram_linked]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, blocked] }
        display_name: { type: [string, 'null'] }
        locale: { type: string }
        telegram_linked: { type: boolean }
        telegram_username: { type: [string, 'null'] }
    UserResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    Device:
      type: object
      required: [id, platform, status, current]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        name: { type: [string, 'null'] }
        app_version: { type: [string, 'null'] }
        status: { type: string, enum: [active, revoked] }
        current: { type: boolean }
        last_seen_at: { type: [string, 'null'], format: date-time }
    DeviceListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Device' } }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    Service:
      type: object
      required: [id, name, status, tier, traffic_used_bytes, device_limit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [pending, active, disabled, expired, revoked] }
        tier: { type: string, enum: [free, premium, vip] }
        country_code: { type: [string, 'null'] }
        traffic_limit_bytes: { type: [integer, 'null'], minimum: 0 }
        traffic_used_bytes: { type: integer, minimum: 0 }
        expires_at: { type: [string, 'null'], format: date-time }
        device_limit: { type: integer, minimum: 1 }
        allowed_protocols:
          type: array
          items: { $ref: '#/components/schemas/Protocol' }
    ServiceResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/Service' }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    ServiceListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Service' } }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    Protocol:
      type: string
      enum: [vless, vmess, trojan, shadowsocks, wireguard]
    Server:
      type: object
      required: [id, code, name, country_code, tier, status, load_ratio, protocols]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        country_code: { type: string, pattern: '^[A-Z]{2}$' }
        city: { type: [string, 'null'] }
        tier: { type: string, enum: [free, premium, vip] }
        status: { type: string, enum: [active, busy, maintenance] }
        load_ratio: { type: number, minimum: 0, maximum: 1 }
        latency_hint_ms: { type: [integer, 'null'], minimum: 0 }
        favorite: { type: boolean, default: false }
        protocols:
          type: array
          items: { $ref: '#/components/schemas/Protocol' }
    ServerListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Server' } }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    ProbeResult:
      type: object
      required: [server_id, success, measured_at]
      properties:
        server_id: { type: string, format: uuid }
        success: { type: boolean }
        latency_ms: { type: [integer, 'null'], minimum: 0 }
        jitter_ms: { type: [integer, 'null'], minimum: 0 }
        packet_success: { type: [number, 'null'], minimum: 0, maximum: 1 }
        measured_at: { type: string, format: date-time }
    ServerRecommendationResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: array
          items:
            type: object
            required: [server, score, reason, probe_required]
            properties:
              server: { $ref: '#/components/schemas/Server' }
              score: { type: number, minimum: 0, maximum: 1 }
              reason: { type: string }
              probe_required: { type: boolean }
