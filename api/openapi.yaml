            properties:
              id: { type: string, format: uuid }
              actor_subject: { type: string }
              action: { type: string }
              resource_type: { type: string }
              resource_id: { type: string }
              reason: { type: string }
              request_id: { type: string, format: uuid }
              outcome: { type: string, enum: [success, denied, failed] }
              created_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    MonitoringOverviewResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          required: [window, services, servers]
          properties:
            window: { type: string, example: PT5M }
            services: { type: array, items: { $ref: '#/components/schemas/OperationalMetricSet' } }
            servers: { type: array, items: { $ref: '#/components/schemas/OperationalMetricSet' } }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    OperationalMetricSet:
      type: object
      required: [resource_id, resource_kind, health, sampled_at, metrics]
      properties:
        resource_id: { type: string }
        resource_kind: { type: string, enum: [vpn_server, api, database, queue, worker] }
        health: { type: string, enum: [healthy, degraded, critical, unknown] }
        sampled_at: { type: string, format: date-time }
        metrics:
          type: object
          additionalProperties: { type: number }
    Alert:
      type: object
      required: [id, rule_key, severity, status, title, opened_at]
      properties:
        id: { type: string, format: uuid }
        rule_key: { type: string }
        severity: { type: string, enum: [info, warning, high, critical] }
        status: { type: string, enum: [open, acknowledged, mitigated, resolved] }
        title: { type: string }
        resource_kind: { type: string }
        resource_id: { type: [string, 'null'] }
        opened_at: { type: string, format: date-time }
    AlertListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    ReleaseRequest:
      type: object
      required: [component, version, environment, artifact_uri, artifact_sha256, source_commit]
      properties:
        component: { type: string, enum: [android, backend, admin, bot, infrastructure] }
        version: { type: string, maxLength: 64 }
        environment: { type: string, enum: [development, testing] }
        artifact_uri: { type: string, format: uri }
        artifact_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        source_commit: { type: string, pattern: '^[a-f0-9]{40}$' }
        rollback_release_id: { type: [string, 'null'], format: uuid }
    QualityRunRequest:
      type: object
      required: [release_id, kind, tool, status, started_at, completed_at, artifact_sha256]
      properties:
        release_id: { type: string, format: uuid }
        kind: { type: string, enum: [unit, integration, ui, security, static_analysis, lint, dependency_scan, performance, accessibility] }
        tool: { type: string, maxLength: 128 }
        status: { type: string, enum: [passed, failed, warning] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        artifact_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        findings:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [rule_id, severity, fingerprint, status]
            properties:
              rule_id: { type: string }
              severity: { type: string, enum: [critical, high, medium, low, info] }
              fingerprint: { type: string }
              status: { type: string, enum: [open, accepted_risk, fixed, false_positive] }
    BackupRequest:
      type: object
      required: [scope, reason]
      properties:
        scope: { type: string, enum: [database, user_data, configurations, server_settings, full] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        retention_class: { type: string, enum: [daily, weekly, monthly, legal_hold], default: daily }
    DisasterRecoveryExerciseRequest:
      type: object
      required: [name, scheduled_at, target_environment, rpo_minutes, rto_minutes]
      properties:
        name: { type: string, minLength: 3, maxLength: 200 }
        scheduled_at: { type: string, format: date-time }
        target_environment: { type: string, enum: [isolated_test] }
        rpo_minutes: { type: integer, minimum: 0 }
        rto_minutes: { type: integer, minimum: 1 }
    SecurityCaseListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, public_code, severity, status, category, opened_at]
            properties:
              id: { type: string, format: uuid }
              public_code: { type: string }
              severity: { type: string, enum: [critical, high, medium, low] }
              status: { type: string, enum: [open, investigating, contained, monitoring, closed] }
              category: { type: string, enum: [login_abuse, token_abuse, api_abuse, suspicious_device, account_sharing, traffic_abuse] }
              pseudonymous_subject: { type: [string, 'null'] }
              opened_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    AbuseActionRequest:
      type: object
      required: [case_id, action, reason, expires_at, appeal_allowed]
      properties:
        case_id: { type: string, format: uuid }
        action: { type: string, enum: [challenge, rate_limit, revoke_session, restrict_device, suspend_service, block_account] }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        expires_at: { type: [string, 'null'], format: date-time }
        appeal_allowed: { type: boolean }
        human_approval_id: { type: [string, 'null'], format: uuid }
    ProductMetricsResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          required: [from, to, minimum_cohort_size, metrics]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            minimum_cohort_size: { type: integer, minimum: 10 }
            metrics: { type: object, additionalProperties: { type: number } }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    FunnelResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: object
          required: [key, window, minimum_cohort_size, steps]
          properties:
            key: { type: string }
            window: { type: string }
            minimum_cohort_size: { type: integer, minimum: 10 }
            steps:
              type: array
              items:
                type: object
                required: [name, users, conversion_ratio]
                properties:
                  name: { type: string }
                  users: { type: integer, minimum: 0 }
                  conversion_ratio: { type: number, minimum: 0, maximum: 1 }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    ProductRecommendationListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, kind, model_version, confidence, evidence_window, explanation, status]
            properties:
              id: { type: string, format: uuid }
              kind: { type: string, enum: [server_quality, churn_risk, recurring_issue, campaign_opportunity] }
              model_version: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              evidence_window: { type: string }
              explanation: { type: string }
              status: { type: string, enum: [proposed, accepted, rejected, expired] }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
    DocumentationArtifactListResponse:
      type: object
      required: [data, meta, error]
      properties:
        data:
          type: array
          items:
            type: object
            required: [key, kind, version, owner, source_uri, checksum, reviewed_at]
            properties:
              key: { type: string }
              kind: { type: string, enum: [architecture, api, database, deployment, security, developer_guide, runbook] }
              version: { type: string }
              owner: { type: string }
              source_uri: { type: string, format: uri }
              checksum: { type: string }
              reviewed_at: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
        error: { type: 'null' }
