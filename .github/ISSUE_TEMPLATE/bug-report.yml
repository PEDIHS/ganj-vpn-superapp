name: گزارش خطا
description: گزارش خطای محصول بدون افشای اطلاعات حساس
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        هیچ کانفیگ VPN، UUID، Token، اطلاعات پرداخت، شماره تلفن، Log خام یا دادهٔ شخصی را اینجا قرار ندهید. برای آسیب‌پذیری امنیتی از فرم عمومی استفاده نکنید.
  - type: dropdown
    id: module
    attributes:
      label: بخش درگیر
      options:
        - VPN Connection
        - Subscription / Purchase
        - Account / Telegram Login
        - Servers / Smart Connect
        - Support / Diagnostics
        - Admin / Backend
        - UI / Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: شرح خطا
      description: چه اتفاقی افتاد و انتظار داشتید چه اتفاقی بیفتد؟
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: مراحل بازتولید
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: نسخه و Build
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: دستگاه و نسخه Android
      placeholder: Pixel 8 / Android 16
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: نوع شبکه
      options:
        - Wi-Fi
        - Mobile data
        - Both
        - Offline / not applicable
    validations:
      required: true
  - type: input
    id: diagnostic_id
    attributes:
      label: Diagnostic ID
      description: فقط شناسهٔ گزارش Redacted داخل اپ؛ Log خام را پیوست نکنید.
  - type: checkboxes
    id: privacy
    attributes:
      label: تأیید حریم خصوصی
      options:
        - label: این گزارش فاقد Secret، کانفیگ اتصال و دادهٔ شخصی است.
          required: true
