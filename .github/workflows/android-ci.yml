name: Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "UPSTREAM.lock.json"
      - ".github/gradle/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-startup-smoke.yml"
      - ".github/workflows/android-native.yml"
      - ".github/scripts/android-startup-smoke.sh"
      - ".github/scripts/vless-tun-fixture.py"
      - ".github/workflows/android-release.yml"
      - ".github/scripts/android-product-guard.sh"
      - ".github/scripts/android-artifact-guard.sh"
      - ".github/scripts/*apk-png.py"
      - ".github/scripts/build-pinned-libxray.sh"
      - ".github/scripts/verify-libxray-embedding.sh"
  push:
    branches: [main, ui/stitch-persian-liquid-v1]
    paths:
      - "apps/android/**"
      - "UPSTREAM.lock.json"
      - ".github/gradle/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-startup-smoke.yml"
      - ".github/workflows/android-native.yml"
      - ".github/scripts/android-startup-smoke.sh"
      - ".github/scripts/vless-tun-fixture.py"
      - ".github/workflows/android-release.yml"
      - ".github/scripts/android-product-guard.sh"
      - ".github/scripts/android-artifact-guard.sh"
      - ".github/scripts/*apk-png.py"
      - ".github/scripts/build-pinned-libxray.sh"
      - ".github/scripts/verify-libxray-embedding.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/android-native.yml
    permissions:
      contents: read

  startup:
    needs: native
    uses: ./.github/workflows/android-startup-smoke.yml
    permissions:
      contents: read

  verify:
    needs: startup
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.logging.stacktrace=all
        -Dkotlin.incremental=false
      GANJ_ALPHA_CONTROL_API_BASE_URL: https://bot.pedramhs.ir/app-api/v1/
      GANJ_ALPHA_TELEGRAM_REDIRECT_URI: https://bot.pedramhs.ir/app-auth/telegram/callback
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enforce Alpha API version prefix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GANJ_ALPHA_CONTROL_API_BASE_URL" = "https://bot.pedramhs.ir/app-api/v1/"

      - uses: actions/download-artifact@v7
        with:
          name: alpha-pinned-libxray
          path: ${{ runner.temp }}/pinned-libxray

      - name: Configure verified native runtime
        run: |
          cmp UPSTREAM.lock.json "$RUNNER_TEMP/pinned-libxray/evidence/UPSTREAM.lock.json"
          (cd "$RUNNER_TEMP/pinned-libxray/evidence" && sha256sum -c SHA256SUMS)
          echo "GANJ_PINNED_LIBXRAY_REPOSITORY=$RUNNER_TEMP/pinned-libxray/maven" >> "$GITHUB_ENV"

      - name: Enforce subscription-only production surface
        working-directory: .
        shell: bash
        run: bash .github/scripts/android-product-guard.sh

      - name: Run unit tests, debug and release lint, and trusted ARM64 alpha build
        working-directory: apps/android
        shell: bash
        run: >-
          gradle --no-daemon --stacktrace --warning-mode all --init-script ../../.github/gradle/pinned-libxray.init.gradle
          -PGANJ_CONTROL_API_BASE_URL="$GANJ_ALPHA_CONTROL_API_BASE_URL"
          -PGANJ_TELEGRAM_REDIRECT_URI="$GANJ_ALPHA_TELEGRAM_REDIRECT_URI"
          -PGANJ_ALPHA_ARM64_ONLY=true
          testDebugUnitTest
          lintDebug
          lintRelease
          :app:assembleDebug
          :app:assembleRelease

      - name: Verify generated Telegram Alpha signing input
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          bash .github/scripts/android-artifact-guard.sh "$apk"
          native_library="$(jq -r '.libXray.androidArtifact.nativeLibrary' UPSTREAM.lock.json)"
          expected_native="$(unzip -p "$RUNNER_TEMP/pinned-libxray/evidence/libXray.aar" "jni/arm64-v8a/$native_library" | sha256sum | cut -d ' ' -f 1)"
          packaged_native="$(unzip -p "$apk" "lib/arm64-v8a/$native_library" | sha256sum | cut -d ' ' -f 1)"
          test "$expected_native" = "$packaged_native"
          size="$(stat -c '%s' "$apk")"
          if (( size > 52428800 )); then
            printf 'Telegram Alpha APK exceeds the 50 MiB Bot API upload limit: %s bytes\n' "$size" >&2
            exit 1
          fi
          sha256sum "$apk" > "$apk.sha256"

      - name: Capture release dependency graph
        working-directory: apps/android
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p app/build/reports
          gradle --no-daemon --console=plain --init-script ../../.github/gradle/pinned-libxray.init.gradle \
            :app:dependencies --configuration releaseRuntimeClasspath \
            > app/build/reports/release-runtime-dependencies.txt

      - name: Generate source and dependency SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: apps/android
          format: spdx-json
          output-file: apps/android/app/build/reports/ganj-vpn-android.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          sbom="apps/android/app/build/reports/ganj-vpn-android.spdx.json"
          test -s "$sbom"
          jq -e '.spdxVersion and (.packages | length > 0)' "$sbom" >/dev/null

      - name: Upload verified Alpha signing input
        uses: actions/upload-artifact@v7
        with:
          name: ganj-vpn-alpha-unsigned-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Upload test, lint and SBOM evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ganj-vpn-quality-${{ github.sha }}
          path: |
            apps/android/**/build/reports/**
            apps/android/**/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

  sign_alpha:
    name: Sign and publish rolling Alpha APK
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/ui/stitch-persian-liquid-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: android-candidate
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out exact Alpha source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java signing tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"

      - name: Install APK signing tools
        shell: bash
        run: sdkmanager "build-tools;36.0.0"

      - name: Download verified unsigned Alpha APK
        uses: actions/download-artifact@v7
        with:
          name: ganj-vpn-alpha-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/alpha-input

      - name: Sign Alpha with protected stable key
        shell: bash
        env:
          GANJ_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          GANJ_UPLOAD_KEYSTORE_SHA256: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_SHA256 }}
          GANJ_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          GANJ_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GANJ_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GANJ_EXPECTED_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          : "${GANJ_UPLOAD_KEYSTORE_B64:?Missing protected Android upload keystore}"
          : "${GANJ_UPLOAD_KEYSTORE_SHA256:?Missing protected keystore checksum}"
          : "${GANJ_UPLOAD_STORE_PASSWORD:?Missing protected keystore password}"
          : "${GANJ_UPLOAD_KEY_ALIAS:?Missing protected upload key alias}"
          : "${GANJ_UPLOAD_KEY_PASSWORD:?Missing protected upload key password}"
          : "${GANJ_EXPECTED_UPLOAD_CERT_SHA256:?Missing expected upload certificate fingerprint}"

          input="$RUNNER_TEMP/alpha-input/app-release-unsigned.apk"
          output="$RUNNER_TEMP/alpha-output"
          keystore="$RUNNER_TEMP/android-upload-keystore.jks"
          aligned="$RUNNER_TEMP/ganj-vpn-alpha-aligned.apk"
          signed="$output/ganj-vpn-alpha-arm64.apk"
          install -d -m 0700 "$output"
          trap 'truncate -s 0 "$keystore" 2>/dev/null || true; rm -f "$keystore"' EXIT

          printf '%s' "$GANJ_UPLOAD_KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 0600 "$keystore"

          normalize_sha256() { tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'; }
          expected_keystore_sha="$(printf '%s' "$GANJ_UPLOAD_KEYSTORE_SHA256" | normalize_sha256)"
          actual_keystore_sha="$(sha256sum "$keystore" | cut -d ' ' -f 1)"
          test "$actual_keystore_sha" = "$expected_keystore_sha"

          expected_cert_sha="$(printf '%s' "$GANJ_EXPECTED_UPLOAD_CERT_SHA256" | normalize_sha256)"
          actual_cert_sha="$(
            keytool -exportcert \
              -keystore "$keystore" \
              -storepass:env GANJ_UPLOAD_STORE_PASSWORD \
              -alias "$GANJ_UPLOAD_KEY_ALIAS" |
              sha256sum | cut -d ' ' -f 1
          )"
          test "$actual_cert_sha" = "$expected_cert_sha"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 "$input" "$aligned"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -P 16 4 "$aligned"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$GANJ_UPLOAD_KEY_ALIAS" \
            --ks-pass env:GANJ_UPLOAD_STORE_PASSWORD \
            --key-pass env:GANJ_UPLOAD_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$signed" \
            "$aligned"

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$signed"
          bash .github/scripts/android-artifact-guard.sh "$signed"
          size="$(stat -c '%s' "$signed")"
          if (( size > 52428800 )); then
            printf 'Signed Telegram Alpha APK exceeds 50 MiB: %s bytes\n' "$size" >&2
            exit 1
          fi
          sha256sum "$signed" > "$signed.sha256"
          printf '%s\n' "$actual_cert_sha" > "$output/signing-cert-sha256.txt"

      - name: Publish stable-signed rolling Alpha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          output="$RUNNER_TEMP/alpha-output"
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' apps/android/app/build.gradle.kts)"
          test -n "$version"
          printf 'Source: %s\nRun: %s/%s/actions/runs/%s\nStable protected APK signing enabled. Startup smoke (API 24/35), tests, lint, size guard and SBOM passed.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$output/alpha-release-notes.txt"
          if gh release view alpha-latest >/dev/null 2>&1; then
            gh release upload alpha-latest \
              "$output/ganj-vpn-alpha-arm64.apk" \
              "$output/ganj-vpn-alpha-arm64.apk.sha256" \
              "$output/signing-cert-sha256.txt" \
              --clobber
            gh release edit alpha-latest --title "Ganj VPN $version" --notes-file "$output/alpha-release-notes.txt"
          else
            gh release create alpha-latest \
              "$output/ganj-vpn-alpha-arm64.apk" \
              "$output/ganj-vpn-alpha-arm64.apk.sha256" \
              "$output/signing-cert-sha256.txt" \
              --target "$GITHUB_SHA" \
              --title "Ganj VPN $version" \
              --notes-file "$output/alpha-release-notes.txt"
          fi

      - name: Upload stable-signed Alpha evidence
        uses: actions/upload-artifact@v7
        with:
          name: ganj-vpn-alpha-signed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/alpha-output/ganj-vpn-alpha-arm64.apk
            ${{ runner.temp }}/alpha-output/ganj-vpn-alpha-arm64.apk.sha256
            ${{ runner.temp }}/alpha-output/signing-cert-sha256.txt
          if-no-files-found: error
          retention-days: 30

