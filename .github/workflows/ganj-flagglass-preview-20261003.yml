name: GANJ 0.3.17 preview APK
on:
  push:
    branches: [feat/ganj-flagglass-config-20261003, feat/ganj-fluid-navigation-0.3.17]
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.4.1'
          cache-provider: basic
      - uses: actions/download-artifact@v7
        with:
          name: alpha-pinned-libxray
          repository: PEDIHS/ganj-vpn-superapp
          run-id: 37093163551
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pinned-libxray
      - name: Verify identical native runtime and protect the production surface
        run: |
          cmp UPSTREAM.lock.json "$RUNNER_TEMP/pinned-libxray/evidence/UPSTREAM.lock.json"
          (cd "$RUNNER_TEMP/pinned-libxray/evidence" && sha256sum -c SHA256SUMS)
          bash .github/scripts/android-product-guard.sh
          echo "GANJ_PINNED_LIBXRAY_REPOSITORY=$RUNNER_TEMP/pinned-libxray/maven" >> "$GITHUB_ENV"
      - name: Build ARM64 installable preview without diagnostic fixtures
        working-directory: apps/android
        run: >-
          gradle --no-daemon --init-script ../../.github/gradle/pinned-libxray.init.gradle
          -PGANJ_CONTROL_API_BASE_URL=https://bot.pedramhs.ir/app-api/v1/
          -PGANJ_TELEGRAM_REDIRECT_URI=https://bot.pedramhs.ir/app-auth/telegram/callback
          -PGANJ_ALPHA_ARM64_ONLY=true
          -PGANJ_NATIVE_FIXTURE_DIAGNOSTICS=false
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify APK packaging and checksum
        run: |
          set -Eeuo pipefail
          apk=apps/android/app/build/outputs/apk/debug/app-debug.apk
          bash .github/scripts/android-artifact-guard.sh "$apk"
          test "$(unzip -Z1 "$apk" | grep -c '^lib/arm64-v8a/libgojni.so$')" -eq 1
          test "$(stat -c '%s' "$apk")" -le 52428800
          sha256sum "$apk" > "$apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ganj-0.3.17-preview-arm64
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
