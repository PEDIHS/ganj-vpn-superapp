name: GANJ verified bot APK candidate transfer

on:
  pull_request:
    paths:
      - ".github/workflows/ganj-verified-bot-candidate.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: ganj-verified-candidate-0324
  cancel-in-progress: false

jobs:
  transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_RUN: "38759222521"
      SOURCE_HEAD: "5222b5c374b9b77a7621ce3664d884f9dc922571"
      TAG: "ganj-mobile-0.3.24-alpha-candidate"
      APK_NAME: "ganj-vpn-0.3.24-alpha-ci.apk"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the exact successful native source build
        shell: bash
        run: |
          set -Eeuo pipefail
          # A one-time candidate transfer. Never build an unreviewed change here.
          passed=0
          for attempt in $(seq 1 100); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source.json"
            if jq -e --arg head "$SOURCE_HEAD" '.head_sha == $head and .name == "Android CI"' "$RUNNER_TEMP/source.json" >/dev/null; then
              conclusion="$(jq -r '.conclusion // ""' "$RUNNER_TEMP/source.json")"
              if [[ "$conclusion" == success ]]; then passed=1; break; fi
              if [[ -n "$conclusion" ]]; then echo "Android CI failed: $conclusion" >&2; exit 1; fi
            else
              echo "Source revision or workflow mismatch" >&2
              exit 1
            fi
            sleep 10
          done
          test "$passed" = 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          name="$(jq -r '[.artifacts[] | select(.name | startswith("ganj-vpn-debug-")) | select(.expired == false) | .name] | first // empty' "$RUNNER_TEMP/artifacts.json")"
          test -n "$name"
          echo "ARTIFACT_NAME=$name" >> "$GITHUB_ENV"

      - name: Retrieve and verify immutable CI APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D "$RUNNER_TEMP/source-apk"
          apk="$(find "$RUNNER_TEMP/source-apk" -type f -name app-debug.apk -print -quit)"
          sumfile="$(find "$RUNNER_TEMP/source-apk" -type f -name app-debug.apk.sha256 -print -quit)"
          test -s "$apk" && test -s "$sumfile"
          expected="$(awk '{print $1}' "$sumfile")"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test "$expected" = "$actual"
          size="$(stat -c '%s' "$apk")"
          test "$size" -gt 1000000 && test "$size" -lt 52428800
          cp "$apk" "$APK_NAME"
          printf '%s  %s\n' "$actual" "$APK_NAME" > "$APK_NAME.sha256"
          printf 'Immutable source: %s\nAndroid CI run: %s\nAPK sha256: %s\nThis is an UNSIGNED-FOR-PRODUCTION CI DEBUG input for existing-key signing on the GANJ bot host.\n' "$SOURCE_HEAD" "$SOURCE_RUN" "$actual" > release-notes.txt

      - name: Publish temporary verifiable asset for bot-host signing
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag already exists; refuse replacement" >&2
            exit 1
          fi
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_HEAD" \
            --title "GANJ 0.3.24-alpha verified CI transfer" \
            --notes-file release-notes.txt \
            --prerelease \
            --latest=false
