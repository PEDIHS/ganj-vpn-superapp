name: CodeQL

on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/codeql.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-android:
    name: Analyze Java and Kotlin
    if: ${{ vars.GHAS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - name: Build analyzed Android sources
        working-directory: apps/android
        shell: bash
        run: >-
          gradle --no-daemon --stacktrace
          :core:billing:assembleDebug
          :core:control-api:assembleDebug
          :core:subscription:assembleDebug
          :core:vpn-api:assembleDebug
          :app:assembleDebug

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  android-static-analysis:
    name: Android static-analysis fallback
    if: ${{ vars.GHAS_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
          cache-read-only: true

      - name: Run Android lint as portable static analysis
        working-directory: apps/android
        shell: bash
        run: gradle --no-daemon --stacktrace lintDebug
