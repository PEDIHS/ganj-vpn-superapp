name: OpenAPI Auth v1 one-shot sync

on:
  push:
    branches: [phase-7/openapi-auth-sync-v1]
    paths:
      - "api/openapi.yaml"
      - ".github/scripts/sync-auth-openapi.py"
      - ".github/workflows/openapi-auth-sync-oneshot.yml"

permissions:
  contents: write

concurrency:
  group: openapi-auth-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: phase-7/openapi-auth-sync-v1
          fetch-depth: 0

      - name: Synchronize Auth Session v1 contract
        run: python3 .github/scripts/sync-auth-openapi.py

      - name: Commit synchronized contract
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- api/openapi.yaml; then
            echo "OpenAPI Auth Session v1 already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi.yaml
          git commit -m "Phase 7 OpenAPI: synchronize Auth Session v1 contract"
          git push origin HEAD:phase-7/openapi-auth-sync-v1
