name: Control API source bundle

on:
  push:
    branches:
      - feat/server-runtime-ganj-bot-integration
    paths:
      - 'services/control-api/**'
      - '.github/workflows/control-api-source-bundle.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate package
        working-directory: services/control-api
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
      - name: Create deterministic source bundle
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/bundle"
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/bundle/control-api-source.tar.gz" \
            services/control-api
          sha256sum "$RUNNER_TEMP/bundle/control-api-source.tar.gz" > "$RUNNER_TEMP/bundle/control-api-source.tar.gz.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/bundle/commit.sha"
      - uses: actions/upload-artifact@v7
        with:
          name: control-api-source-${{ github.sha }}
          path: ${{ runner.temp }}/bundle/**
          if-no-files-found: error
          retention-days: 3
