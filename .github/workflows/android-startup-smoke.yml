name: Android startup smoke
on:
  workflow_call:
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: "9.4.1"
          cache-provider: basic
      - uses: actions/download-artifact@v7
        with:
          name: alpha-pinned-libxray
          path: ${{ runner.temp }}/pinned-libxray
      - name: Configure verified native runtime
        run: |
          cmp UPSTREAM.lock.json "$RUNNER_TEMP/pinned-libxray/evidence/UPSTREAM.lock.json"
          (cd "$RUNNER_TEMP/pinned-libxray/evidence" && sha256sum -c SHA256SUMS)
          echo "GANJ_PINNED_LIBXRAY_REPOSITORY=$RUNNER_TEMP/pinned-libxray/maven" >> "$GITHUB_ENV"
      - name: Build emulator-compatible Alpha from the same source
        working-directory: apps/android
        run: >-
          gradle --no-daemon --init-script ../../.github/gradle/pinned-libxray.init.gradle :app:assembleDebug :app:assembleDebugAndroidTest
          -PGANJ_CONTROL_API_BASE_URL=https://bot.pedramhs.ir/app-api/v1/
          -PGANJ_TELEGRAM_REDIRECT_URI=https://bot.pedramhs.ir/app-auth/telegram/callback
          -PGANJ_ALPHA_ARM64_ONLY=false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch twice and require a live resumed Activity
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-startup-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-evidence-api-${{ matrix.api }}-${{ github.sha }}
          path: startup-evidence/
          if-no-files-found: warn
          retention-days: 7
