name: Phase 0 docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON design tokens
        run: jq empty design/tokens.json
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml
      - name: Block common private artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(google-services\.json|GoogleService-Info\.plist|.*\.(apk|aab|jks|keystore|p12)|error_log)$'; then
            echo 'Sensitive or generated artifact is tracked.'
            exit 1
          fi

