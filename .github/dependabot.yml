version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: gradle
    directory: "/apps/android"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
