name: ganj-vpn-${GANJ_ENVIRONMENT:-production}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "${CONTAINER_LOG_MAX_SIZE:-20m}"
    max-file: "${CONTAINER_LOG_MAX_FILES:-5}"

x-hardening: &service-hardening
  restart: unless-stopped
  read_only: true
  init: true
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  logging: *bounded-logging

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be an immutable digest}
    user: "70:70"
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ganj_control}
      POSTGRES_USER: ${POSTGRES_USER:-ganj_control}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /run/postgresql:rw,nosuid,nodev,size=8m,uid=70,gid=70
      - /tmp:rw,noexec,nosuid,size=16m,uid=70,gid=70
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s
    logging: *bounded-logging

  migrate:
    image: ${CONTROL_API_IMAGE:?CONTROL_API_IMAGE must be an immutable digest}
    <<: *service-hardening
    restart: "no"
    entrypoint: ["/opt/ganj/ops/with-database-url.sh"]
    command: ["node", "src/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      MIGRATIONS_INCLUDE_TEST_SEED: "false"
    secrets:
      - database_url
    volumes:
      - ./scripts/with-database-url.sh:/opt/ganj/ops/with-database-url.sh:ro
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    image: ${CONTROL_API_IMAGE:?CONTROL_API_IMAGE must be an immutable digest}
    <<: *service-hardening
    entrypoint: ["/opt/ganj/ops/production-entrypoint.sh"]
    command: ["node", "src/index.js"]
    environment:
      NODE_ENV: production
      CONTROL_API_ADAPTER_MODE: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_SSL: ${DATABASE_SSL:-disable}
      CONTROL_API_DATA_ADAPTER_MODULE: ./src/adapters/postgres.js
      CONTROL_API_AUTH_ADAPTER_MODULE: ./src/adapters/jwks-auth.js
      CONTROL_API_PURCHASE_ADAPTER_MODULE: ./src/adapters/google-play.js
      CONTROL_API_TELEGRAM_AUTH_ADAPTER_MODULE: ./src/adapters/telegram-oidc.js
      CONTROL_API_PLAY_NOTIFICATIONS_ADAPTER_MODULE: ./src/adapters/google-play-rtdn.js
      CONTROL_API_ENTERPRISE_SECURITY_ADAPTER_MODULE: ./src/enterprise.js
      CONTROL_API_SERVER_SECRET_ADAPTER_MODULE: /opt/ganj/adapters/server-secret.mjs
      CONTROL_API_TELEGRAM_ACCOUNT_BROKER_MODULE: /opt/ganj/adapters/telegram-account-broker.mjs
      CONTROL_API_ASSIGNMENT_SECRET_FILE: /run/secrets/assignment_secret
      CONTROL_API_RUNTIME_CONFIG_PRIVATE_KEY_FILE: /run/secrets/runtime_config_private_key
      CONTROL_API_RUNTIME_CONFIG_KEY_VERSION: ${RUNTIME_CONFIG_KEY_VERSION:?set RUNTIME_CONFIG_KEY_VERSION}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI:?set AUTH_JWKS_URI}
      AUTH_ISSUER: ${AUTH_ISSUER:?set AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-ganj-control-api}
      AUTH_ALLOWED_ALGORITHMS: ${AUTH_ALLOWED_ALGORITHMS:-RS256}
      TELEGRAM_OIDC_TOKEN_ENDPOINT: ${TELEGRAM_OIDC_TOKEN_ENDPOINT:?set TELEGRAM_OIDC_TOKEN_ENDPOINT}
      TELEGRAM_OIDC_JWKS_URI: ${TELEGRAM_OIDC_JWKS_URI:?set TELEGRAM_OIDC_JWKS_URI}
      TELEGRAM_OIDC_ISSUER: ${TELEGRAM_OIDC_ISSUER:?set TELEGRAM_OIDC_ISSUER}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:?set TELEGRAM_OIDC_CLIENT_ID}
      TELEGRAM_OIDC_CLIENT_SECRET_FILE: /run/secrets/telegram_oidc_client_secret
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.ganj.vpn}
      GOOGLE_PLAY_SERVICE_ACCOUNT_FILE: /run/secrets/google_play_service_account
      PLAY_RTDN_AUDIENCE: ${PLAY_RTDN_AUDIENCE:?set PLAY_RTDN_AUDIENCE}
      PLAY_RTDN_SERVICE_ACCOUNT: ${PLAY_RTDN_SERVICE_ACCOUNT:?set PLAY_RTDN_SERVICE_ACCOUNT}
      PLAY_RTDN_SUBSCRIPTION: ${PLAY_RTDN_SUBSCRIPTION:?set PLAY_RTDN_SUBSCRIPTION}
      SERVER_SECRET_RESOLVER_URL: ${SERVER_SECRET_RESOLVER_URL:?set SERVER_SECRET_RESOLVER_URL}
      SERVER_SECRET_RESOLVER_TOKEN_FILE: /run/secrets/server_secret_resolver_token
      TELEGRAM_ACCOUNT_BROKER_URL: ${TELEGRAM_ACCOUNT_BROKER_URL:?set TELEGRAM_ACCOUNT_BROKER_URL}
      TELEGRAM_ACCOUNT_BROKER_TOKEN_FILE: /run/secrets/telegram_account_broker_token
      RUNTIME_ENVIRONMENT: ${GANJ_ENVIRONMENT:-production}
    secrets:
      - database_url
      - assignment_secret
      - runtime_config_private_key
      - telegram_oidc_client_secret
      - google_play_service_account
      - server_secret_resolver_token
      - telegram_account_broker_token
    volumes:
      - ./scripts/production-entrypoint.sh:/opt/ganj/ops/production-entrypoint.sh:ro
      - ./adapters:/opt/ganj/adapters:ro
    networks: [control, data, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  reverse-proxy:
    image: ${NGINX_IMAGE:?NGINX_IMAGE must be an immutable digest}
    <<: *service-hardening
    user: "101:101"
    ports:
      - "${PUBLIC_HTTPS_BIND:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:8443"
    secrets:
      - source: tls_certificate
        target: tls_certificate
        mode: 0444
      - source: tls_private_key
        target: tls_private_key
        mode: 0400
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
    networks: [edge, control]
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 20s

  backup:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be an immutable digest}
    profiles: ["operations"]
    user: "70:70"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/opt/ganj/ops/backup-postgres.sh"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      BACKUP_DIRECTORY: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    secrets:
      - database_url
    volumes:
      - ./scripts/backup-postgres.sh:/opt/ganj/ops/backup-postgres.sh:ro
      - postgres_backups:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=70,gid=70
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging

volumes:
  postgres_data:
  postgres_backups:

networks:
  edge:
  egress:
  control:
    internal: true
  data:
    internal: true

secrets:
  postgres_password:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/postgres_password
  database_url:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/database_url
  assignment_secret:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/assignment_secret
  runtime_config_private_key:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/runtime_config_private_key.pem
  telegram_oidc_client_secret:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/telegram_oidc_client_secret
  google_play_service_account:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/google_play_service_account.json
  server_secret_resolver_token:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/server_secret_resolver_token
  telegram_account_broker_token:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/telegram_account_broker_token
  tls_certificate:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/tls_certificate.pem
  tls_private_key:
    file: ${GANJ_SECRETS_DIR:?set GANJ_SECRETS_DIR}/tls_private_key.pem
