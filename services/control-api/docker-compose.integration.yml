services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ganj_control_test
      POSTGRES_USER: ganj_test
      POSTGRES_PASSWORD: testtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganj_test -d ganj_control_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  integration:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://ganj_test:testtest@postgres:5432/ganj_control_test
      TEST_DATABASE_URL: postgres://ganj_test:testtest@postgres:5432/ganj_control_test
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "test:postgres"]
